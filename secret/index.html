<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>secret · terminal-MC</title>
    <meta name="robots" content="noindex, nofollow" />
    <style>
      :root {
        --bg: #070b0a;
        --panel: #0d1412;
        --line: #1c2b26;
        --fg: #86efac;
        --dim: #4b7a63;
        --accent: #d9f99d;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        background: radial-gradient(1200px 600px at 50% -10%, #122a22 0%, transparent 60%), var(--bg);
        color: var(--fg);
        font: 14px/1.7 ui-monospace, SFMono-Regular, "Cascadia Mono", Consolas, monospace;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .term {
        width: min(760px, 100%);
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6), inset 0 0 0 1px rgba(134, 239, 172, 0.04);
        overflow: hidden;
      }
      .bar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 14px;
        background: #0a110f;
        border-bottom: 1px solid var(--line);
        color: var(--dim);
        font-size: 12px;
      }
      .dot { width: 10px; height: 10px; border-radius: 50%; background: #223a31; }
      .bar .name { margin-left: 6px; letter-spacing: 0.04em; }
      pre {
        margin: 0;
        padding: 22px 20px 10px;
        white-space: pre-wrap;
        word-break: break-word;
        min-height: 320px;
      }
      a { color: var(--accent); text-decoration: none; border-bottom: 1px dashed rgba(217, 249, 157, 0.4); }
      a:hover { border-bottom-color: var(--accent); }
      .caret {
        display: inline-block;
        width: 8px;
        height: 15px;
        background: var(--fg);
        vertical-align: -2px;
        animation: blink 1.1s steps(1) infinite;
      }
      @keyframes blink { 50% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .caret { animation: none; } }
    </style>
  </head>
  <body>
    <main class="term">
      <div class="bar">
        <span class="dot"></span><span class="dot"></span><span class="dot"></span>
        <span class="name">terminal-MC@xiaoheng224: ~</span>
      </div>
      <pre id="log"></pre>
    </main>
    <script>
      var LINES = [
        '$ whoami',
        'terminal-MC —— 写点代码，也拍点东西。',
        '',
        '$ cat contact.txt',
        'Bilibili  terminal-MC  (UID 3632302038976622)',
        'GitHub    github.com/xiaoheng224',
        'Email     dgwttw@163.com',
        'QQ        3986612383',
        '',
        '$ echo "你居然连点了 5 下头像。"',
        '你居然连点了 5 下头像。',
        '',
        '$ hint',
        '老玩家应该知道：↑↑↓↓←→←→BA',
        '',
        '> 回 <a href="/">首页</a> 吧，这里没有别的了。',
        '',
        '$ ',
      ];

      var log = document.getElementById('log');
      var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var index = 0;

      function renderLine(text, done) {
        var caret = document.createElement('span');
        caret.className = 'caret';
        var node = document.createElement('span');
        log.appendChild(node);
        log.appendChild(caret);

        if (reduce || text.indexOf('<a ') >= 0 || text === '') {
          node.innerHTML = text;
          caret.remove();
          if (done) done();
          return;
        }

        var position = 0;
        var timer = setInterval(function () {
          position += 2;
          node.textContent = text.slice(0, position);
          if (position >= text.length) {
            clearInterval(timer);
            caret.remove();
            if (done) done();
          }
        }, 12);
      }

      function next() {
        if (index >= LINES.length) return;
        var line = LINES[index++];
        renderLine(line, function () {
          log.appendChild(document.createTextNode('\n'));
          setTimeout(next, 100);
        });
      }

      next();
    </script>
  </body>
</html>
